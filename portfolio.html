<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gunel's Story — Admin Panel</title>

<link rel="icon" type="image/png" href="image/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg:#FAF8F5;
    --primary:#0F1A5C;
    --gold:#D97706;
    --text:#1E293B;
    --muted:#64748B;
    --white:#fff;
    --danger:#DC2626;
    --danger-bg:#FEE2E2;
    --success:#059669;
    --success-bg:#E6F4EA;
    --edit:#2563EB;
    --edit-bg:#EFF6FF;
    --border:rgba(15,26,92,.08);
    --shadow:0 12px 34px rgba(15,26,92,.07);
    --radius:18px;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body {
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

button,
input {
    font:inherit;
}

button {
    cursor:pointer;
}

/* LOGIN */

.login-overlay {
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 10% 20%,#18277c 0%,#050A28 80%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.login-box {
    width:100%;
    max-width:440px;
    padding:45px;
    background:rgba(255,255,255,.96);
    border-radius:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.login-box h2 {
    color:var(--primary);
    font-size:30px;
    margin-bottom:8px;
}

.login-subtitle {
    color:var(--muted);
    margin-bottom:30px;
}

.input-group {
    margin-bottom:18px;
}

.input-label {
    display:block;
    color:var(--primary);
    font-size:12px;
    font-weight:800;
    margin-bottom:8px;
    text-transform:uppercase;
}

.login-input,
.form-input {
    width:100%;
    padding:14px 16px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    background:#F8FAFC;
}

.login-input:focus,
.form-input:focus {
    border-color:var(--primary);
    background:white;
    box-shadow:0 0 0 4px rgba(15,26,92,.06);
}

.password-container {
    position:relative;
}

.password-container .login-input {
    padding-right:50px;
}

.toggle-password {
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:none;
    color:var(--muted);
}

.toggle-password svg {
    width:20px;
    height:20px;
    fill:currentColor;
}

.login-btn {
    width:100%;
    margin-top:8px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:var(--primary);
    color:white;
    font-weight:800;
}

.login-btn:disabled {
    opacity:.6;
    cursor:wait;
}

.login-back {
    display:block;
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    text-decoration:none;
}

#loginError {
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:var(--danger-bg);
    color:var(--danger);
    font-size:13px;
    font-weight:700;
}

/* ADMIN */

.admin-container {
    display:none;
    max-width:1400px;
    margin:20px auto;
    padding:35px;
    background:white;
    border-radius:24px;
    box-shadow:var(--shadow);
}

.admin-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding-bottom:25px;
    margin-bottom:25px;
    border-bottom:1px solid var(--border);
}

.admin-header h1 {
    color:var(--primary);
}

.logout-btn {
    border:0;
    background:var(--danger-bg);
    color:var(--danger);
    padding:11px 18px;
    border-radius:10px;
    font-weight:800;
}

/* TABS */

.admin-tabs {
    display:flex;
    gap:6px;
    padding:5px;
    margin-bottom:30px;
    background:#F8FAFC;
    border-radius:12px;
    width:max-content;
}

.admin-tab {
    border:0;
    background:transparent;
    color:var(--muted);
    padding:12px 22px;
    border-radius:9px;
    font-weight:800;
}

.admin-tab.active {
    background:var(--primary);
    color:white;
}

.admin-section {
    display:none;
}

.admin-section.active {
    display:block;
}

/* ORDERS */

.table-responsive {
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:15px;
}

table {
    width:100%;
    border-collapse:collapse;
}

th {
    background:#F8FAFC;
    padding:16px;
    text-align:left;
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
}

td {
    padding:16px;
    border-top:1px solid var(--border);
    font-size:14px;
}

.parent-name {
    color:var(--primary);
    font-weight:800;
}

.age {
    background:#F1F5F9;
    color:var(--primary);
    padding:6px 10px;
    border-radius:7px;
    font-weight:700;
}

.action-buttons {
    display:flex;
    gap:7px;
}

.status-btn,
.delete-btn {
    border:0;
    padding:8px 11px;
    border-radius:8px;
    font-weight:700;
}

.status-btn {
    background:#FEF3C7;
    color:#D97706;
}

.status-btn.checked {
    background:var(--success-bg);
    color:var(--success);
}

.delete-btn {
    background:var(--danger-bg);
    color:var(--danger);
}

/* PORTFOLIO */

.portfolio-toolbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.section-title h2 {
    color:var(--primary);
    font-size:24px;
}

.section-title p {
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.add-btn {
    border:0;
    background:var(--primary);
    color:white;
    padding:13px 20px;
    border-radius:11px;
    font-weight:800;
}

.portfolio-grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:24px;
}

.portfolio-card {
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:16px;
    background:white;
    box-shadow:0 4px 15px rgba(15,26,92,.04);
}

.portfolio-image {
    width:100%;
    aspect-ratio:16/11;
    background:#F1F5F9;
    overflow:hidden;
}

.portfolio-image img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.portfolio-info {
    padding:18px;
}

.portfolio-info h3 {
    color:var(--primary);
    font-size:16px;
    margin-bottom:7px;
}

.author {
    color:var(--gold);
    font-size:12px;
    font-weight:800;
}

.portfolio-actions {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:16px;
}

.edit-btn,
.remove-btn {
    border:0;
    padding:10px;
    border-radius:9px;
    font-weight:800;
}

.edit-btn {
    background:var(--edit-bg);
    color:var(--edit);
}

.remove-btn {
    background:var(--danger-bg);
    color:var(--danger);
}

.empty {
    grid-column:1/-1;
    text-align:center;
    padding:60px;
    border:1px dashed #CBD5E1;
    border-radius:15px;
    color:var(--muted);
}

/* MODAL */

.modal {
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(5,10,40,.7);
    backdrop-filter:blur(7px);
}

.modal.active {
    display:flex;
}

.modal-box {
    width:100%;
    max-width:620px;
    max-height:92vh;
    overflow-y:auto;
    padding:28px;
    background:white;
    border-radius:20px;
}

.modal-header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.modal-header h2 {
    color:var(--primary);
}

.close-btn {
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#F1F5F9;
    font-size:22px;
}

.form-group {
    margin-bottom:18px;
}

.form-label {
    display:block;
    margin-bottom:8px;
    color:var(--primary);
    font-size:12px;
    font-weight:800;
}

.upload-area {
    min-height:220px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px dashed #CBD5E1;
    border-radius:14px;
    background:#F8FAFC;
    cursor:pointer;
    overflow:hidden;
}

.upload-area input {
    display:none;
}

.upload-placeholder {
    text-align:center;
    color:var(--muted);
}

.upload-placeholder strong {
    display:block;
    color:var(--primary);
    margin-bottom:5px;
}

#imagePreview {
    display:none;
    max-width:100%;
    max-height:320px;
    object-fit:contain;
}

.modal-actions {
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

.modal-action {
    border:0;
    padding:12px 20px;
    border-radius:10px;
    font-weight:800;
}

.cancel-btn {
    background:#F1F5F9;
    color:var(--muted);
}

.save-btn {
    background:var(--primary);
    color:white;
}

.save-btn:disabled {
    opacity:.6;
    cursor:wait;
}

.loading {
    grid-column:1/-1;
    text-align:center;
    padding:50px;
    color:var(--muted);
}

/* RESPONSIVE */

@media(max-width:1050px) {
    .portfolio-grid {
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px) {

    body {
        padding:10px;
    }

    .admin-container {
        padding:18px;
    }

    .admin-header {
        flex-direction:column;
        align-items:flex-start;
    }

    .portfolio-toolbar {
        flex-direction:column;
        align-items:stretch;
    }

    .add-btn {
        width:100%;
    }

    .portfolio-grid {
        grid-template-columns:1fr;
    }

    .login-box {
        padding:30px 22px;
    }

    .modal-actions {
        flex-direction:column;
    }

    .modal-action {
        width:100%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-overlay" id="loginOverlay">

    <div class="login-box">

        <h2>Xoş Gəldiniz</h2>

        <p class="login-subtitle">
            Gunel's Story Admin Panelinə giriş edin
        </p>

        <div class="input-group">
            <label class="input-label">İstifadəçi adı</label>

            <input
                type="text"
                id="username"
                class="login-input"
                placeholder="admin"
            >
        </div>

        <div class="input-group">

            <label class="input-label">Şifrə</label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    class="login-input"
                    placeholder="••••••••"
                >

                <button
                    class="toggle-password"
                    type="button"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>

        </div>

        <button
            class="login-btn"
            id="loginBtn"
            onclick="checkLogin()"
        >
            Sistemə Daxil Ol
        </button>

        <a href="index.html" class="login-back">
            ← Əsas səhifəyə qayıt
        </a>

        <div id="loginError"></div>

    </div>

</div>


<!-- ADMIN -->

<div class="admin-container" id="adminContainer">

    <div class="admin-header">

        <h1>İdarəetmə Paneli</h1>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Sistemdən çıxış
        </button>

    </div>


    <!-- TABS -->

    <div class="admin-tabs">

        <button
            class="admin-tab active"
            onclick="switchTab('orders',this)"
        >
            Sifarişlər
        </button>

        <button
            class="admin-tab"
            onclick="switchTab('portfolio',this)"
        >
            Portfolio
        </button>

    </div>


    <!-- ORDERS -->

    <section
        id="ordersSection"
        class="admin-section active"
    >

        <div class="table-responsive">

            <table>

                <thead>
                    <tr>
                        <th>Valideyn</th>
                        <th>Əlaqə</th>
                        <th>Uşaq</th>
                        <th>Yaş</th>
                        <th>Maraq</th>
                        <th>Tarix</th>
                        <th>Əməliyyat</th>
                    </tr>
                </thead>

                <tbody id="ordersBody">

                    <tr>
                        <td colspan="7">
                            Məlumatlar yüklənir...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- PORTFOLIO -->

    <section
        id="portfolioSection"
        class="admin-section"
    >

        <div class="portfolio-toolbar">

            <div class="section-title">

                <h2>Portfolio</h2>

                <p>
                    Saytda göstərilən kitabları buradan idarə edin.
                </p>

            </div>

            <button
                class="add-btn"
                onclick="openNewPortfolio()"
            >
                + Yeni portfolio əlavə et
            </button>

        </div>


        <div
            class="portfolio-grid"
            id="portfolioGrid"
        >

            <div class="loading">
                Portfolio yüklənir...
            </div>

        </div>

    </section>

</div>


<!-- PORTFOLIO MODAL -->

<div
    class="modal"
    id="portfolioModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                Yeni Portfolio
            </h2>

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <input
            type="hidden"
            id="portfolioId"
        >


        <div class="form-group">

            <label class="form-label">
                Kitab / hekayə adı
            </label>

            <input
                type="text"
                id="portfolioTitle"
                class="form-input"
                placeholder="Məsələn: Sehrli meşədə bir gün"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Müəllif adı
            </label>

            <input
                type="text"
                id="portfolioAuthor"
                class="form-input"
                placeholder="Məsələn: Psixoloq Günel Mahmudqızı"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Portfolio şəkli
            </label>

            <label
                class="upload-area"
                for="portfolioImage"
            >

                <input
                    type="file"
                    id="portfolioImage"
                    accept="image/jpeg,image/png,image/webp"
                    onchange="previewImage(event)"
                >

                <div
                    class="upload-placeholder"
                    id="uploadPlaceholder"
                >

                    <strong>
                        Şəkil seçin
                    </strong>

                    JPG, PNG və ya WebP

                </div>

                <img
                    id="imagePreview"
                    alt="Portfolio şəkli"
                >

            </label>

        </div>


        <div class="modal-actions">

            <button
                class="modal-action cancel-btn"
                onclick="closeModal()"
            >
                Ləğv et
            </button>

            <button
                class="modal-action save-btn"
                id="saveBtn"
                onclick="savePortfolio()"
            >
                Yadda saxla
            </button>

        </div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<script>

/* =========================================================
   FIREBASE CONFIG
   SƏNİN MÖVCUD CONFIG-IN
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDWqLPM2X89vyqOYocw4KEBh65WKMutZOI",

    authDomain:
        "gunelsstory-6d3a9.firebaseapp.com",

    projectId:
        "gunelsstory-6d3a9",

    storageBucket:
        "gunelsstory-6d3a9.firebasestorage.app",

    messagingSenderId:
        "903174908342",

    appId:
        "1:903174908342:web:f73871214550442e553917",

    measurementId:
        "G-5Q48RSFFH9"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================================================
   LOGIN
========================================================= */

function togglePassword() {

    const input =
        document.getElementById("password");

    input.type =
        input.type === "password"
            ? "text"
            : "password";
}


async function checkLogin() {

    const username =
        document.getElementById("username")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    const btn =
        document.getElementById("loginBtn");

    const error =
        document.getElementById("loginError");

    error.style.display = "none";

    btn.disabled = true;
    btn.innerText = "Doğrulanır...";

    try {

        const doc =
            await db
                .collection("adminConfig")
                .doc("credentials")
                .get();

        if (!doc.exists) {

            throw new Error(
                "adminConfig/credentials tapılmadı."
            );

        }

        const data = doc.data();

        if (
            username !== data.username ||
            password !== data.password
        ) {

            throw new Error(
                "İstifadəçi adı və ya şifrə yanlışdır."
            );

        }

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        showAdmin();

    } catch(error) {

        errorMessage(error.message);

    } finally {

        btn.disabled = false;
        btn.innerText = "Sistemə Daxil Ol";

    }
}


function errorMessage(message) {

    const box =
        document.getElementById("loginError");

    box.innerText =
        message ||
        "Giriş zamanı xəta baş verdi.";

    box.style.display = "block";
}


function showAdmin() {

    document.getElementById(
        "loginOverlay"
    ).style.display = "none";

    document.getElementById(
        "adminContainer"
    ).style.display = "block";

    startOrders();

    startPortfolio();

}


function logout() {

    localStorage.removeItem(
        "adminLoggedIn"
    );

    location.reload();
}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        if (
            localStorage.getItem(
                "adminLoggedIn"
            ) === "true"
        ) {

            showAdmin();

        }

    }
);


/* =========================================================
   TABS
========================================================= */

function switchTab(
    tabName,
    button
) {

    document
        .querySelectorAll(".admin-tab")
        .forEach(function(tab) {

            tab.classList.remove("active");

        });


    document
        .querySelectorAll(".admin-section")
        .forEach(function(section) {

            section.classList.remove("active");

        });


    button.classList.add("active");


    document
        .getElementById(
            tabName + "Section"
        )
        .classList.add("active");

}


/* =========================================================
   ORDERS
========================================================= */

let ordersUnsubscribe = null;


function startOrders() {

    if (ordersUnsubscribe) {
        ordersUnsubscribe();
    }

    ordersUnsubscribe =
        db.collection("orders")
            .onSnapshot(

                function(snapshot) {

                    renderOrders(snapshot);

                },

                function(error) {

                    document.getElementById(
                        "ordersBody"
                    ).innerHTML = `
                        <tr>
                            <td colspan="7"
                                style="color:#DC2626">
                                Xəta: ${escapeHtml(
                                    error.message
                                )}
                            </td>
                        </tr>
                    `;

                }

            );

}


function renderOrders(snapshot) {

    const body =
        document.getElementById(
            "ordersBody"
        );

    body.innerHTML = "";


    if (snapshot.empty) {

        body.innerHTML = `
            <tr>
                <td colspan="7"
                    style="text-align:center;padding:40px">
                    Hələ heç bir sifariş yoxdur.
                </td>
            </tr>
        `;

        return;
    }


    const items = [];


    snapshot.forEach(function(doc) {

        items.push({
            id:doc.id,
            data:doc.data()
        });

    });


    items.sort(function(a,b) {

        const aTime =
            getTime(a.data.createdAt);

        const bTime =
            getTime(b.data.createdAt);

        return bTime - aTime;

    });


    items.forEach(function(item) {

        const data = item.data;

        const tr =
            document.createElement("tr");

        const viewed =
            data.isViewed === true;

        let date = "-";

        if (
            data.createdAt &&
            typeof data.createdAt.toDate ===
            "function"
        ) {

            date =
                data.createdAt
                    .toDate()
                    .toLocaleString(
                        "az-AZ"
                    );

        }


        tr.innerHTML = `

            <td class="parent-name">
                ${escapeHtml(
                    data.parentName ||
                    "Qeyd edilməyib"
                )}
            </td>

            <td>
                ${escapeHtml(
                    data.parentPhone ||
                    "Qeyd edilməyib"
                )}
            </td>

            <td>
                ${escapeHtml(
                    data.childName ||
                    "Qeyd edilməyib"
                )}
            </td>

            <td>
                <span class="age">
                    ${escapeHtml(
                        data.childAge || "-"
                    )} yaş
                </span>
            </td>

            <td>
                ${escapeHtml(
                    data.childInterests ||
                    "Qeyd yoxdur"
                )}
            </td>

            <td>
                ${escapeHtml(date)}
            </td>

            <td>

                <div class="action-buttons">

                    <button
                        class="status-btn ${
                            viewed ? "checked" : ""
                        }"
                        onclick="toggleOrderStatus(
                            '${item.id}',
                            ${viewed}
                        )"
                    >
                        ${
                            viewed
                                ? "✓ Baxıldı"
                                : "• Gözləyir"
                        }
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteOrder(
                            '${item.id}'
                        )"
                    >
                        🗑
                    </button>

                </div>

            </td>

        `;

        body.appendChild(tr);

    });

}


function toggleOrderStatus(
    id,
    current
) {

    db.collection("orders")
        .doc(id)
        .update({
            isViewed:!current
        })
        .catch(function(error) {

            alert(
                "Xəta: " +
                error.message
            );

        });

}


async function deleteOrder(id) {

    if (
        !confirm(
            "Bu sifarişi silmək istəyirsiniz?"
        )
    ) {
        return;
    }

    try {

        await db
            .collection("orders")
            .doc(id)
            .delete();

    } catch(error) {

        alert(
            "Silinmə xətası: " +
            error.message
        );

    }

}


/* =========================================================
   PORTFOLIO REAL-TIME
========================================================= */

let portfolioUnsubscribe = null;


function startPortfolio() {

    if (portfolioUnsubscribe) {
        portfolioUnsubscribe();
    }


    portfolioUnsubscribe =
        db.collection("portfolio")
            .onSnapshot(

                function(snapshot) {

                    renderPortfolio(snapshot);

                },

                function(error) {

                    console.error(
                        "Portfolio xətası:",
                        error
                    );

                    document.getElementById(
                        "portfolioGrid"
                    ).innerHTML = `
                        <div class="empty">
                            Portfolio yüklənmədi.<br><br>
                            ${escapeHtml(
                                error.message
                            )}
                        </div>
                    `;

                }

            );

}


function renderPortfolio(snapshot) {

    const grid =
        document.getElementById(
            "portfolioGrid"
        );

    grid.innerHTML = "";


    if (snapshot.empty) {

        grid.innerHTML = `
            <div class="empty">

                <strong>
                    Portfolio boşdur
                </strong>

                <br><br>

                İlk portfolio-nu əlavə edin.

            </div>
        `;

        return;
    }


    const items = [];


    snapshot.forEach(function(doc) {

        items.push({
            id:doc.id,
            data:doc.data()
        });

    });


    /* Köhnə və yeni məlumatların hamısı
       burada birlikdə göstərilir */

    items.sort(function(a,b) {

        const aTime =
            getTime(a.data.createdAt);

        const bTime =
            getTime(b.data.createdAt);

        return bTime - aTime;

    });


    items.forEach(function(item) {

        const data =
            item.data;

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "portfolio-card";


        const image =
            data.imageUrl ||
            "";


        card.innerHTML = `

            <div class="portfolio-image">

                ${
                    image
                    ? `
                        <img
                            src="${escapeAttribute(image)}"
                            alt="${escapeAttribute(
                                data.title ||
                                "Portfolio"
                            )}"
                        >
                    `
                    : `
                        <div style="
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#64748B;
                        ">
                            Şəkil yoxdur
                        </div>
                    `
                }

            </div>


            <div class="portfolio-info">

                <h3>
                    ${escapeHtml(
                        data.title ||
                        "Adsız portfolio"
                    )}
                </h3>


                <div class="author">

                    ${escapeHtml(
                        data.author ||
                        "Müəllif qeyd edilməyib"
                    )}

                </div>


                <div class="portfolio-actions">

                    <button
                        class="edit-btn"
                        onclick="editPortfolio(
                            '${item.id}'
                        )"
                    >
                        ✏️ Düzəliş et
                    </button>


                    <button
                        class="remove-btn"
                        onclick="removePortfolio(
                            '${item.id}',
                            '${escapeAttribute(
                                data.title ||
                                "Portfolio"
                            )}'
                        )"
                    >
                        🗑️ Sil
                    </button>

                </div>

            </div>

        `;


        grid.appendChild(card);

    });

}

/* =========================================================
   EDIT PORTFOLIO
========================================================= */

async function editPortfolio(id) {

    try {

        const doc =
            await db
                .collection("portfolio")
                .doc(id)
                .get();


        if (!doc.exists) {

            alert(
                "Portfolio tapılmadı."
            );

            return;
        }


        const data =
            doc.data();


        document.getElementById(
            "modalTitle"
        ).innerText =
            "Portfolioya düzəliş et";


        document.getElementById(
            "portfolioId"
        ).value =
            id;


        document.getElementById(
            "portfolioTitle"
        ).value =
            data.title || "";


        document.getElementById(
            "portfolioAuthor"
        ).value =
            data.author || "";


        document.getElementById(
            "portfolioImage"
        ).value = "";


        if (data.imageUrl) {

            const preview =
                document.getElementById(
                    "imagePreview"
                );

            preview.src =
                data.imageUrl;

            preview.style.display =
                "block";

            document.getElementById(
                "uploadPlaceholder"
            ).style.display =
                "none";

        } else {

            resetPreview();

        }


        document.getElementById(
            "portfolioModal"
        ).classList.add("active");

    } catch(error) {

        alert(
            "Portfolio açılmadı:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   IMAGE PREVIEW
========================================================= */

function previewImage(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Zəhmət olmasa şəkil seçin."
        );

        event.target.value = "";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const preview =
                document.getElementById(
                    "imagePreview"
                );

            preview.src =
                event.target.result;

            preview.style.display =
                "block";


            document.getElementById(
                "uploadPlaceholder"
            ).style.display =
                "none";

        };


    reader.readAsDataURL(file);

}


function resetPreview() {

    const preview =
        document.getElementById(
            "imagePreview"
        );

    preview.src = "";

    preview.style.display =
        "none";


    document.getElementById(
        "uploadPlaceholder"
    ).style.display =
        "block";

}


/* =========================================================
   IMAGE OPTIMIZATION
========================================================= */

function optimizeImage(file) {

    return new Promise(
        function(resolve,reject) {

            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    const img =
                        new Image();


                    img.onload =
                        function() {

                            const MAX =
                                1200;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if (
                                width > MAX ||
                                height > MAX
                            ) {

                                if (
                                    width >
                                    height
                                ) {

                                    height =
                                        Math.round(
                                            height *
                                            MAX /
                                            width
                                        );

                                    width =
                                        MAX;

                                } else {

                                    width =
                                        Math.round(
                                            width *
                                            MAX /
                                            height
                                        );

                                    height =
                                        MAX;

                                }

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            /*
                             * Şəkli WebP formatında
                             * sıxırıq.
                             */

                            let quality =
                                0.72;

                            let result =
                                canvas.toDataURL(
                                    "image/webp",
                                    quality
                                );


                            /*
                             * Firestore sənədi 1 MiB
                             * limitinə malikdir.
                             */

                            while (
                                result.length >
                                    800000 &&
                                quality > 0.35
                            ) {

                                quality -= 0.07;

                                result =
                                    canvas.toDataURL(
                                        "image/webp",
                                        quality
                                    );

                            }


                            if (
                                result.length >
                                900000
                            ) {

                                reject(
                                    new Error(
                                        "Şəkil Firestore üçün çox böyükdür. Daha kiçik şəkil seçin."
                                    )
                                );

                                return;
                            }


                            resolve(result);

                        };


                    img.onerror =
                        function() {

                            reject(
                                new Error(
                                    "Şəkil oxunmadı."
                                )
                            );

                        };


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                function() {

                    reject(
                        new Error(
                            "Şəkil oxunarkən xəta baş verdi."
                        )
                    );

                };


            reader.readAsDataURL(file);

        }
    );

}


/* =========================================================
   SAVE PORTFOLIO
========================================================= */

async function savePortfolio() {

    const title =
        document.getElementById(
            "portfolioTitle"
        ).value.trim();


    const author =
        document.getElementById(
            "portfolioAuthor"
        ).value.trim();


    const id =
        document.getElementById(
            "portfolioId"
        ).value.trim();


    const file =
        document.getElementById(
            "portfolioImage"
        ).files[0];


    const button =
        document.getElementById(
            "saveBtn"
        );


    if (!title) {

        alert(
            "Kitab / hekayə adını yazın."
        );

        return;
    }


    if (!author) {

        alert(
            "Müəllif adını yazın."
        );

        return;
    }


    /*
     * Yeni portfolio-dursa şəkil
     * mütləq seçilməlidir.
     */

    if (!id && !file) {

        alert(
            "Yeni portfolio üçün şəkil seçin."
        );

        return;
    }


    button.disabled = true;

    button.innerText =
        "Yadda saxlanılır...";


    try {

        let imageUrl = null;


        /*
         * Yalnız yeni şəkil seçilibsə
         * onu Firestore üçün optimallaşdırırıq.
         */

        if (file) {

            imageUrl =
                await optimizeImage(
                    file
                );

        }


        /* =================================================
           MÖVCUD PORTFOLIOYA DÜZƏLİŞ
        ================================================= */

        if (id) {

            const updateData = {

                title:title,

                author:author,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            };


            /*
             * Yeni şəkil seçilibsə,
             * imageUrl dəyişir.
             *
             * Şəkil seçilməyibsə,
             * köhnə imageUrl qalır.
             */

            if (imageUrl) {

                updateData.imageUrl =
                    imageUrl;

            }


            await db
                .collection("portfolio")
                .doc(id)
                .update(updateData);


            alert(
                "Portfolio uğurla yeniləndi."
            );

        }


        /* =================================================
           YENİ PORTFOLIO
        ================================================= */

        else {

            await db
                .collection("portfolio")
                .add({

                    title:title,

                    author:author,

                    imageUrl:imageUrl,

                    createdAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp(),

                    updatedAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                });


            alert(
                "Portfolio uğurla əlavə edildi."
            );

        }


        closeModal();


    } catch(error) {

        console.error(
            "Portfolio save error:",
            error
        );


        alert(
            "Xəta baş verdi:\n\n" +
            error.message
        );

    } finally {

        button.disabled = false;

        button.innerText =
            "Yadda saxla";

    }

}


/* =========================================================
   DELETE PORTFOLIO
========================================================= */

async function removePortfolio(
    id,
    title
) {

    if (
        !confirm(
            `"${title}" portfolio elementini silmək istəyirsiniz?`
        )
    ) {
        return;
    }


    try {

        await db
            .collection("portfolio")
            .doc(id)
            .delete();


        alert(
            "Portfolio silindi."
        );

    } catch(error) {

        alert(
            "Silinmə zamanı xəta:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   HELPERS
========================================================= */

function getTime(timestamp) {

    if (
        timestamp &&
        typeof timestamp.toMillis ===
        "function"
    ) {

        return timestamp.toMillis();

    }

    return 0;

}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}
